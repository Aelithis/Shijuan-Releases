name: 问题反馈
description: 拾卷哪里不对劲
labels: ["bug"]
body:
  - type: dropdown
    id: platform
    attributes:
      label: 平台
      options:
        - macOS
        - Windows
        - Android
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 拾卷版本
      description: 设置的「关于」分区里能看到。
      placeholder: 0.2.0
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 你做了什么,看到了什么,期望是什么。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 怎么复现
      placeholder: |
        1. 打开某本书
        2. 翻到第三章
        3. 出现……
  - type: textarea
    id: extra
    attributes:
      label: 补充材料
      description: 截图、日志片段,或者能复现问题的书籍格式。日志文件在设置「同步」分区的「打开日志目录」里。
